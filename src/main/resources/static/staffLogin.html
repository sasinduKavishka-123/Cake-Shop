<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Sugar &amp; Flour</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>

        :root{
            --cream: #FBF3EA;
            --cream-warm: #FFFDFB;
            --blush: #F3C9D0;
            --terracotta: #C97B5F;
            --terracotta-deep:#B4644B;
            --espresso: #3A2822;
            --espresso-soft: #6e0912;
            --gold: #C79A4B;
            --gold-light:#EFDDB8;
            --line: rgba(58,40,34,0.10);
            --error:#B3452E;
            --success:#4C7A4A;
            --shadow-sm: 0 8px 20px -12px rgba(58,40,34,0.22);
            --shadow-lg: 0 30px 60px -24px rgba(58,40,34,0.32);
        }

        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Manrope',sans-serif;
            background:var(--cream);
            color:var(--espresso);
            -webkit-font-smoothing:antialiased;
            min-height:100vh;
        }
        img{display:block;max-width:100%;}
        h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-0.01em;line-height:1.1;}
        button{font-family:inherit;cursor:pointer;border:none;background:none;}
        a{color:inherit;text-decoration:none;}

        /* ============ PAGE SHELL ============ */
        .shell{
            min-height:100vh;
            display:grid;
            grid-template-columns:1fr 1fr;
        }

        /* ============ LEFT VISUAL PANEL ============ */
        .visual-panel{
            position:relative;
            overflow:hidden;
            background:var(--espresso);
        }
        .visual-panel img{
            position:absolute;
            inset:0;
            width:100%;height:100%;
            object-fit:cover;
            opacity:0.82;
        }
        .visual-scrim{
            position:absolute;inset:0;
            background:linear-gradient(180deg, rgba(58,40,34,0.15) 0%, rgba(58,40,34,0.35) 55%, rgba(58,40,34,0.86) 100%);
        }
        .visual-content{
            position:relative;
            z-index:2;
            height:100%;
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            padding:48px;
            color:var(--cream-warm);
        }
        .visual-logo{
            display:flex;
            align-items:center;
            gap:10px;
            font-family:'Fraunces',serif;
            font-size:1.4rem;
            font-weight:600;
        }
        .visual-logo .logo-mark{
            width:36px;height:36px;
            border-radius:50%;
            background:var(--blush);
            display:flex;align-items:center;justify-content:center;
            flex:none;
        }
        .visual-logo .amp{font-style:italic;color:var(--gold-light);font-weight:500;}

        .visual-quote{
            max-width:420px;
        }
        .visual-quote .eyebrow{
            text-transform:uppercase;
            letter-spacing:0.18em;
            font-size:0.7rem;
            font-weight:800;
            color:var(--gold-light);
            display:block;
            margin-bottom:16px;
        }
        .visual-quote h2{
            font-size:clamp(1.7rem,2.6vw,2.3rem);
            font-style:italic;
            font-weight:500;
            margin-bottom:18px;
        }
        .visual-quote p{
            font-size:0.92rem;
            color:rgba(255,253,251,0.75);
            line-height:1.6;
        }

        /* ============ RIGHT FORM PANEL ============ */
        .form-panel{
            display:flex;
            align-items:center;
            justify-content:center;
            padding:40px;
            background:var(--cream);
        }
        .form-wrap{
            width:100%;
            max-width:420px;
        }

        .mobile-logo{
            display:none;
            align-items:center;
            gap:10px;
            font-family:'Fraunces',serif;
            font-size:1.3rem;
            font-weight:600;
            margin-bottom:36px;
            justify-content:center;
        }
        .mobile-logo .logo-mark{
            width:34px;height:34px;
            border-radius:50%;
            background:var(--blush);
            display:flex;align-items:center;justify-content:center;
        }
        .mobile-logo .amp{font-style:italic;color:var(--gold);font-weight:500;}

        .form-head{margin-bottom:34px;}
        .form-head .eyebrow{
            text-transform:uppercase;
            letter-spacing:0.16em;
            font-size:0.7rem;
            font-weight:800;
            color:var(--terracotta);
            display:block;
            margin-bottom:12px;
        }
        .form-head h1{font-size:clamp(1.9rem,3.2vw,2.3rem);margin-bottom:10px;}
        .form-head p{color:var(--espresso-soft);font-size:0.95rem;line-height:1.6;}
        .form-head p a{font-weight:800;color:var(--terracotta-deep);border-bottom:1.5px solid var(--terracotta-deep);}
        .form-head p a:hover{color:var(--gold); border-color:var(--gold);}

        .divider{
            display:flex;
            align-items:center;
            gap:14px;
            margin-bottom:26px;
            color:var(--espresso-soft);
            font-size:0.78rem;
            font-weight:700;
        }
        .divider::before, .divider::after{
            content:'';
            flex:1;
            height:1px;
            background:var(--line);
        }

        /* ---- form fields ---- */
        .field-group{margin-bottom:20px;}
        .field-group label{
            display:block;
            font-size:0.76rem;
            font-weight:800;
            text-transform:uppercase;
            letter-spacing:0.06em;
            color:var(--espresso-soft);
            margin-bottom:9px;
        }
        .input-wrap{
            position:relative;
        }
        .input-wrap input{
            width:100%;
            padding:15px 16px;
            border-radius:14px;
            border:1.5px solid var(--line);
            background:var(--cream-warm);
            font-family:'Manrope',sans-serif;
            font-size:0.95rem;
            color:var(--espresso);
            transition:all .2s ease;
        }
        .input-wrap input::placeholder{color:#B8A99F;}
        .input-wrap input:focus{
            outline:none;
            border-color:var(--gold);
            box-shadow:0 0 0 4px rgba(199,154,75,0.15);
        }
        .input-wrap.error input{border-color:var(--error);}
        .input-wrap.error input:focus{box-shadow:0 0 0 4px rgba(179,69,46,0.12);}
        .input-wrap.success input{border-color:var(--success);}

        .input-icon{
            position:absolute;
            right:14px;top:50%;
            transform:translateY(-50%);
            color:var(--espresso-soft);
            display:flex;
            align-items:center;
        }
        .toggle-pass{
            position:absolute;
            right:14px;top:50%;
            transform:translateY(-50%);
            color:var(--espresso-soft);
            font-size:0.78rem;
            font-weight:800;
            letter-spacing:0.02em;
            padding:4px;
        }
        .toggle-pass:hover{color:var(--terracotta-deep);}

        .field-msg{
            font-size:0.76rem;
            margin-top:7px;
            color:var(--error);
            display:none;
            align-items:center;
            gap:5px;
        }
        .field-msg.show{display:flex;}
        .forgot-link{
            font-size:0.86rem;
            font-weight:800;
            color:var(--terracotta-deep);
            border-bottom:1.5px solid transparent;
        }
        .forgot-link:hover{color:var(--gold); border-color:var(--gold);}

        .submit-btn{
            width:100%;
            padding:17px;
            border-radius:14px;
            background:var(--espresso);
            color:var(--cream-warm);
            font-weight:800;
            font-size:1rem;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:10px;
            position:relative;
            overflow:hidden;
            transition:transform .2s ease, background .3s ease;
            margin:42px 0 22px 0;
        }
        .submit-btn:hover{background:var(--gold); color:var(--espresso);}
        .submit-btn:active{transform:scale(0.98);}
        .submit-btn.loading .btn-label{opacity:0;}
        .submit-btn.success{background:var(--success); color:#fff;}
        .spinner{
            position:absolute;
            width:20px;height:20px;
            border-radius:50%;
            border:2.5px solid rgba(255,255,255,0.35);
            border-top-color:#fff;
            opacity:0;
            animation:spin .7s linear infinite;
        }
        .submit-btn.loading .spinner{opacity:1;}
        @keyframes spin{to{transform:rotate(360deg);}}

        .ripple{
            position:absolute;
            border-radius:50%;
            background:rgba(255,255,255,0.5);
            transform:scale(0);
            animation:ripple .6s ease-out;
            pointer-events:none;
        }
        @keyframes ripple{to{transform:scale(3);opacity:0;}}

        .signup-line{
            text-align:center;
            font-size:0.9rem;
            color:var(--espresso-soft);
        }
        .signup-line a{
            font-weight:800;
            color:var(--terracotta-deep);
            border-bottom:1.5px solid var(--terracotta-deep);
        }
        .signup-line a:hover{color:var(--gold); border-color:var(--gold);}

        /* ============ RESPONSIVE ============ */
        @media (max-width:900px){
            .shell{grid-template-columns:1fr;}
            .visual-panel{display:none;}
            .form-panel{min-height:100vh; padding:60px 24px;}
            .mobile-logo{display:flex;}
        }
        @media (max-width:420px){
            .form-panel{padding:44px 18px;}
        }
    </style>
</head>
<body>

<div class="shell">

    <!-- ================= LEFT VISUAL PANEL ================= -->
    <div class="visual-panel">
        <img src="https://images.unsplash.com/photo-1517686469429-8bdb88b9f907?auto=format&fit=crop&w=1200&q=80" alt="Baker preparing fresh pastries">
        <div class="visual-scrim"></div>
        <div class="visual-content">
            <div class="visual-logo">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3c2 2 3 4 3 6.2A3 3 0 0 1 12 12a3 3 0 0 1-3-2.8C9 7 10 5 12 3Z" fill="#C79A4B"/><path d="M4 14c0-1.1.9-2 2-2h12a2 2 0 0 1 2 2v.5c0 .8-.6 1.5-1.4 1.5H5.4A1.4 1.4 0 0 1 4 14.5V14Z" fill="#3A2822"/><rect x="5" y="17" width="14" height="3.2" rx="1.6" fill="#3A2822"/></svg>
        </span>
                Sugar<span class="amp">&amp;</span>Flour
            </div>
            <div class="visual-quote">
                <span class="eyebrow">Welcome Back</span>
                <h2>"Every box from Sugar &amp; Flour feels like a little celebration."</h2>
            </div>
        </div>
    </div>

    <!-- ================= RIGHT FORM PANEL ================= -->
    <div class="form-panel">
        <div class="form-wrap">

            <div class="mobile-logo">
        <span class="logo-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3c2 2 3 4 3 6.2A3 3 0 0 1 12 12a3 3 0 0 1-3-2.8C9 7 10 5 12 3Z" fill="#C79A4B"/><path d="M4 14c0-1.1.9-2 2-2h12a2 2 0 0 1 2 2v.5c0 .8-.6 1.5-1.4 1.5H5.4A1.4 1.4 0 0 1 4 14.5V14Z" fill="#3A2822"/><rect x="5" y="17" width="14" height="3.2" rx="1.6" fill="#3A2822"/></svg>
        </span>
                Sugar<span class="amp">&amp;</span>Flour
            </div>

            <div class="form-head">
                <span class="eyebrow">Staff Sign In</span>
                <h1>Welcome back.</h1>
            </div>

            <div class="divider">sign in with email</div>

            <form id="loginForm" novalidate>

                <div class="field-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap" id="emailWrap">
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
                    </div>
                    <div class="field-msg" id="emailMsg">Please enter a valid email address.</div>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <div class="input-wrap" id="passwordWrap">
                        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="toggle-pass" id="togglePass">SHOW</button>
                    </div>
                    <div class="field-msg" id="passwordMsg">Password must be at least 6 characters.</div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    <span class="btn-label">Sign In</span>
                    <span class="spinner"></span>
                </button>
            </form>
        </div>
    </div>

</div>

<!-- ***** jQuery **** -->
<script src="../lib/jquery-4.0.0.min.js"></script>

<script>
    $(document).ready(function() {
        // DOM elements
        const $togglePass = $('#togglePass');
        const $passwordInput = $('#password');
        const $emailInput = $('#email');
        const $emailWrap = $('#emailWrap');
        const $emailMsg = $('#emailMsg');
        const $passwordWrap = $('#passwordWrap');
        const $passwordMsg = $('#passwordMsg');
        const $form = $('#loginForm');
        const $submitBtn = $('#submitBtn');
        const $btnLabel = $submitBtn.find('.btn-label');

        /* ---- password visibility toggle ---- */
        $togglePass.on('click', function() {
            const isPassword = $passwordInput.attr('type') === 'password';
            $passwordInput.attr('type', isPassword ? 'text' : 'password');
            $togglePass.text(isPassword ? 'HIDE' : 'SHOW');
        });

        /* ---- validation helpers ---- */
        function validEmail(v) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
        }

        function validateEmail() {
            const val = $emailInput.val().trim();
            if (val === '') {
                $emailWrap.removeClass('error success');
                $emailMsg.removeClass('show');
                return false;
            }
            const ok = validEmail(val);
            $emailWrap.toggleClass('error', !ok).toggleClass('success', ok);
            $emailMsg.toggleClass('show', !ok);
            return ok;
        }

        function validatePassword() {
            const val = $passwordInput.val();
            if (val === '') {
                $passwordWrap.removeClass('error success');
                $passwordMsg.removeClass('show');
                return false;
            }
            const ok = val.length >= 6;
            $passwordWrap.toggleClass('error', !ok).toggleClass('success', ok);
            $passwordMsg.toggleClass('show', !ok);
            return ok;
        }

        $emailInput.on('blur', validateEmail);
        $emailInput.on('input', function() {
            if ($emailWrap.hasClass('error')) validateEmail();
        });

        $passwordInput.on('blur', validatePassword);
        $passwordInput.on('input', function() {
            if ($passwordWrap.hasClass('error')) validatePassword();
        });

        /* ---- submit flow ---- */
        $form.on('submit', function(e) {
            e.preventDefault();

            // Ripple Effect
            const offset = $submitBtn.offset();
            const width = $submitBtn.outerWidth();
            const height = $submitBtn.outerHeight();
            const size = Math.max(width, height);

            const pageX = e.pageX || (offset.left + width / 2);
            const pageY = e.pageY || (offset.top + height / 2);

            const clickX = pageX - offset.left - size / 2;
            const clickY = pageY - offset.top - size / 2;

            const $ripple = $('<span>', {
                class: 'ripple',
                css: {
                    width: size + 'px',
                    height: size + 'px',
                    left: clickX + 'px',
                    top: clickY + 'px'
                }
            });

            $submitBtn.append($ripple);
            setTimeout(() => $ripple.remove(), 650);

            // Validation execution
            const emailOk = validateEmail();
            const passOk = validatePassword();

            if ($emailInput.val().trim() === '') {
                $emailWrap.addClass('error');
                $emailMsg.addClass('show');
            }
            if ($passwordInput.val() === '') {
                $passwordWrap.addClass('error');
                $passwordMsg.addClass('show');
            }

            if (!emailOk || !passOk) return;

            // Loading state
            $submitBtn.addClass('loading').prop('disabled', true);

            const obj = JSON.stringify({
                "userEmail":$emailInput.val().trim(),
                "password":$passwordInput.val().trim(),
                "userRoles":"Admin"
            });

            setTimeout(() => {

                $.ajax({
                    url:"http://localhost:8080/v1/test/login",
                    type:'POST',
                    contentType:'application/json',
                    data:obj,
                    success: function(response){
                        alert(response.message);

                        if(response.status === 200){

                            localStorage.setItem("JWT", response.body.token);
                            localStorage.setItem("UserID", response.body.userId);
                            localStorage.setItem("UserName", response.body.userName);

                            $submitBtn.removeClass('loading').addClass('success');
                            $btnLabel.text('✓ Signed In').css('opacity', 1);

                            setTimeout(()=>{
                                window.location.href = 'dashboard.html';
                            }, 500);
                        }
                        else{
                            $submitBtn.removeClass('loading').prop('disabled', false);
                            $btnLabel.text('Sign In');
                        }
                    },
                    error: function (){
                        alert("SERVER DOES NOT RESPONDED");
                    }
                });
            }, 500);
        });
    });
</script>

</body>
</html>
